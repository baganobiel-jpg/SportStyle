<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Entre ou crie sua conta na SportStyle.">
<meta name="theme-color" content="#0a0a0c">
<title>Entrar | SportStyle</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23e01f1f'/%3E%3Ctext x='50' y='68' font-size='58' font-weight='800' font-family='sans-serif' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<a href="#conteudo" class="skip-link">Ir para o conteúdo</a>

<header class="header">
  <div class="logo">
    <a href="index.html">SPORTSTYLE</a>
  </div>

  <nav class="menu" aria-label="Menu principal">
    <a href="index.html">Início</a>
    <a href="masculino.html">Catálogo</a>
    <a href="carrinho.html">
      Carrinho
      <span id="cart-count">0</span>
    </a>
  </nav>
</header>

<main class="auth-page" id="conteudo">

  <!-- FORMULÁRIO DE LOGIN -->
  <div class="auth-box" id="box-login">
    <h1>Bem-vindo de volta</h1>
    <p class="auth-subtitle">Entre na sua conta para continuar.</p>

    <p class="auth-erro" id="erro-login" role="alert"></p>

    <form id="form-login">
      <div class="auth-field">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" required placeholder="seuemail@exemplo.com" autocomplete="email">
      </div>

      <div class="auth-field">
        <label for="login-senha">Senha</label>
        <input type="password" id="login-senha" required placeholder="••••••••" autocomplete="current-password">
      </div>

      <button type="submit" class="btn auth-submit">Entrar</button>
    </form>

    <p class="auth-switch">
      Ainda não tem conta? <a href="#" id="ir-cadastro">Cadastre-se</a>
    </p>
  </div>

  <!-- FORMULÁRIO DE CADASTRO -->
  <div class="auth-box" id="box-cadastro" style="display:none;">
    <h1>Criar conta</h1>
    <p class="auth-subtitle">Cadastre-se para comprar mais rápido.</p>

    <p class="auth-erro" id="erro-cadastro" role="alert"></p>

    <form id="form-cadastro">
      <div class="auth-field">
        <label for="cad-nome">Nome completo</label>
        <input type="text" id="cad-nome" required placeholder="Seu nome" autocomplete="name">
      </div>

      <div class="auth-field">
        <label for="cad-email">E-mail</label>
        <input type="email" id="cad-email" required placeholder="seuemail@exemplo.com" autocomplete="email">
      </div>

      <div class="auth-field">
        <label for="cad-senha">Senha</label>
        <input type="password" id="cad-senha" required placeholder="Mínimo 6 caracteres" minlength="6" autocomplete="new-password">
      </div>

      <div class="auth-field">
        <label for="cad-senha2">Confirmar senha</label>
        <input type="password" id="cad-senha2" required placeholder="Repita a senha" minlength="6" autocomplete="new-password">
      </div>

      <button type="submit" class="btn auth-submit">Criar conta</button>
    </form>

    <p class="auth-switch">
      Já tem conta? <a href="#" id="ir-login">Entrar</a>
    </p>
  </div>

</main>

<footer>
  <h3>SPORTSTYLE</h3>
  <p class="footer-links">
    <a href="index.html">Início</a>
    <a href="masculino.html">Catálogo</a>
    <a href="carrinho.html">Carrinho</a>
  </p>
  <p>© 2026 Todos os direitos reservados.</p>
</footer>

<script src="js/produtos.js"></script>
<script src="js/carrinho.js"></script>
<script src="js/auth.js"></script>
<script src="js/animacoes.js"></script>

<script>
  /* Quem já está logado não precisa desta página */
  if (getUsuarioLogado()) {
    window.location.replace(getDestinoPosLogin());
  }

  const boxLogin = document.getElementById("box-login");
  const boxCadastro = document.getElementById("box-cadastro");

  function mostrarErro(id, mensagem) {
    const el = document.getElementById(id);
    el.textContent = mensagem;
    el.classList.add("show");
  }

  function limparErros() {
    document.querySelectorAll(".auth-erro").forEach(el => el.classList.remove("show"));
  }

  document.getElementById("ir-cadastro").addEventListener("click", (e) => {
    e.preventDefault();
    limparErros();
    boxLogin.style.display = "none";
    boxCadastro.style.display = "block";
    document.getElementById("cad-nome").focus();
  });

  document.getElementById("ir-login").addEventListener("click", (e) => {
    e.preventDefault();
    limparErros();
    boxCadastro.style.display = "none";
    boxLogin.style.display = "block";
    document.getElementById("login-email").focus();
  });

  document.getElementById("form-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    limparErros();
    const email = document.getElementById("login-email").value;
    const senha = document.getElementById("login-senha").value;

    const resultado = await loginUsuario(email, senha);

    if (resultado.sucesso) {
      window.location.href = getDestinoPosLogin();
    } else {
      mostrarErro("erro-login", resultado.mensagem);
    }
  });

  document.getElementById("form-cadastro").addEventListener("submit", async (e) => {
    e.preventDefault();
    limparErros();
    const nome = document.getElementById("cad-nome").value;
    const email = document.getElementById("cad-email").value;
    const senha = document.getElementById("cad-senha").value;
    const senha2 = document.getElementById("cad-senha2").value;

    if (senha !== senha2) {
      mostrarErro("erro-cadastro", "As senhas não coincidem.");
      return;
    }

    const resultado = await cadastrarUsuario(nome, email, senha);

    if (resultado.sucesso) {
      window.location.href = getDestinoPosLogin();
    } else {
      mostrarErro("erro-cadastro", resultado.mensagem);
    }
  });
</script>

</body>
</html>
